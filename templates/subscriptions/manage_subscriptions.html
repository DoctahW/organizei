{% extends "base.html" %}

{% block content %}
<main class="main-content" style="padding-top: 40px; min-height: 100vh; background: #121212;">
    <div class="glass" style="padding: 30px; border-radius: 25px; max-width: 500px; margin: 0 auto; color: white; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);">
        
        <header style="margin-bottom: 30px;">
            <h2 style="color: #ffca28; margin-bottom: 5px; font-size: 1.8rem;">Assinaturas</h2>
            <p style="opacity: 0.6; font-size: 0.9rem;">Gerencie seus gastos fixos mensais</p>
        </header>

        <form method="post" action="{% url 'subscriptions:manage_subscriptions' %}" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}
            
            <div class="input-group">
                <input type="text" name="name" placeholder="Ex: Netflix, Aluguel, Internet" required 
                       style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
            </div>

            <div style="display: flex; gap: 10px;">
                <input type="number" name="day" placeholder="Dia" min="1" max="31" required 
                       style="flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
                
                <input type="text" name="value" placeholder="Valor (Ex: 55,90)" required 
                       style="flex: 2; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white;">
            </div>

            <button type="submit" class="button-glass" 
                    style="background: #ffca28; color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;">
                + Adicionar Assinatura
            </button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">

        <div class="list" style="display: flex; flex-direction: column; gap: 12px;">
            {% for sub in subscriptions %}
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 18px; border: 1px solid rgba(255,255,255,0.08);">
                <div>
                    <span style="display: block; font-weight: bold; font-size: 1.1rem;">{{ sub.name }}</span>
                    <small style="opacity: 0.5;">Todo dia {{ sub.day_of_month }}</small>
                </div>
                
                <div style="text-align: right;">
                    <span style="display: block; color: #ff5252; font-weight: bold; margin-bottom: 5px;">R$ {{ sub.value }}</span>
                    
                    <form action="{% url 'subscriptions:delete_subscription' sub.pk %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" style="background: none; border: none; color: #ff5252; font-size: 0.75rem; cursor: pointer; text-decoration: underline; padding: 0; opacity: 0.8;">
                            Remover
                        </button>
                    </form>
                </div>
            </div>
            {% empty %}
            <div style="text-align: center; padding: 20px; opacity: 0.4;">
                <p>Nenhuma assinatura cadastrada.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</main>
{% endblock %}
