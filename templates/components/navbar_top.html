{% load static %}
<header class="navbar">
  <div class="navbar__inner">

    <a href="/" class="navbar__brand" aria-label="Organizei">
        <img src="{% static 'img/logo.png' %}" alt="Organizei" width="60" height="58">
    </a>
    <div class="main_section" aria-label="Navegação principal">
        <nav class="navbar__nav">
        <a href="{% url 'dashboard:home' %}" class="button-glass {% if request.resolver_match.namespace == 'dashboard' %}button-glass--active{% endif %}">
            Painel
        </a>
        <a href="{% url 'transactions:list' %}" class="button-glass {% if request.resolver_match.namespace == 'transactions' %}button-glass--active{% endif %}">
            Transações
        </a>
        <a href="{% url 'goals:list' %}" class="button-glass {% if request.resolver_match.namespace == 'goals' %}button-glass--active{% endif %}" {% if request.resolver_match.namespace == 'goals' %}aria-current="page"{% endif %}>
            Objetivos
        </a>
        <a href="{% url 'budget:list' %}" class="button-glass {% if request.resolver_match.namespace == 'budget' %}button-glass--active{% endif %}" {% if request.resolver_match.namespace == 'budget' %}aria-current="page"{% endif %}>
            Orçamentos
        </a>
        <a href="{% url 'investments:list' %}" class="button-glass {% if request.resolver_match.namespace == 'investments' %}button-glass--active{% endif %}" {% if request.resolver_match.namespace == 'investments' %}aria-current="page"{% endif %}>Investimentos</a>
        </nav>

        <div class="navbar__actions">
        <button class="icon-btn glass" aria-label="Notificações">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </button>
        <a href="{% url 'accounts:profile' %}" class="icon-btn glass" aria-label="Minha conta">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
            </svg>
        </a>
        <form method="post" action="{% url 'accounts:logout' %}" class="navbar__logout-form">
          {% csrf_token %}
          <button type="submit" class="icon-btn glass" aria-label="Sair da conta">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </form>
        </div>
    </div>
  </div>
  <div class="navbar__divider"></div>
</header>
